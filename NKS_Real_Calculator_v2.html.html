<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NKS Real MLE Engineering Calculator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 450px; max-width: 90%; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; text-align: center; }
        h1 span { color: #e74c3c; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #34495e; }
        #results { margin-top: 30px; display: none; background: #ecf0f1; padding: 20px; border-radius: 8px; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
        .result-item:last-child { border-bottom: none; }
        .value { font-weight: bold; color: #27ae60; }
        .warning { color: #e74c3c; font-size: 14px; margin-top: 10px; display: none; text-align: center; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #95a5a6; }
        .note { font-size: 12px; color: #7f8c8d; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1><span>NKS</span> Real MLE Calculator</h1>
    
    <div class="form-group">
        <label for="citySelect">Select City / Hazard</label>
        <select id="citySelect">
            <option value="">-- Choose a city --</option>
            <option value="miami">Miami (Hurricane Wind)</option>
            <option value="chicago">Chicago (Winter Wind)</option>
            <option value="la">Los Angeles (Seismic PGA)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="yearInput">Select Year (1973-2025)</label>
        <input type="number" id="yearInput" min="1973" max="2025" placeholder="e.g. 2023">
    </div>

    <button onclick="runRealCalculation()">Calculate NKS Design Load</button>

    <div id="results">
        <div class="result-item"><span>NKS Adaptive Factor (Ω):</span> <span class="value" id="outputOmega">--</span></div>
        <div class="result-item"><span>Steel Savings / Load Reduction:</span> <span class="value" id="outputSavings">--</span></div>
        <div class="result-item"><span>50-Year Return Value (V50):</span> <span class="value" id="outputV50">--</span></div>
        <div class="result-item" style="border-bottom: 2px solid #2c3e50; padding-bottom: 12px; margin-bottom: 12px;"><span><strong>NKS Design Load:</strong></span> <span class="value" id="outputDesignLoad" style="color: #e74c3c; font-size: 18px;">--</span></div>
        <div class="result-item"><span>Your Calculated β:</span> <span class="value" id="outputBeta" style="color: #27ae60;">--</span></div>
    </div>
    <div id="warningMsg" class="warning"></div>
    <div class="note">* Uses Maximum Likelihood Estimation (MLE) for Gumbel fitting.</div>
    <div class="footer">Powered by the NKS Framework. © 2026</div>
</div>

<script>
    // --- Load the raw data ---
    let miamiData = [];
    let chicagoData = [];
    let laData = [];

    async function loadData() {
        try {
            // For local testing, use relative paths. For GitHub, use the raw URLs.
            const miamiResp = await fetch('miami_raw.json');
            miamiData = await miamiResp.json();
            const chicagoResp = await fetch('chicago_raw.json');
            chicagoData = await chicagoResp.json();
            const laResp = await fetch('la_raw.json');
            laData = await laResp.json();
        } catch (e) {
            document.getElementById('warningMsg').innerText = "⚠️ Data files missing. Please ensure JSON files are in the same folder.";
            document.getElementById('warningMsg').style.display = 'block';
        }
    }
    loadData();

    // --- THE EXACT MLE SOLVER ---
    function gumbelMLE(values) {
        const n = values.length;
        const mean = values.reduce((a,b) => a + b, 0) / n;
        const variance = values.reduce((a,b) => a + (b - mean)**2, 0) / n;
        
        let sigma = Math.sqrt(6 * variance) / Math.PI;
        for (let iter = 0; iter < 20; iter++) {
            let sum_exp = 0, sum_x_exp = 0;
            for (let v of values) {
                let e = Math.exp(-v / sigma);
                sum_exp += e;
                sum_x_exp += v * e;
            }
            let f = sigma - (sum_x_exp / sum_exp - mean);
            let df = 1 - (sum_x_exp * sum_exp / sum_exp**2 - sum_x_exp / sum_exp) / sigma;
            sigma = sigma - f / df;
            if (Math.abs(f) < 1e-6) break;
        }
        let mu = -sigma * Math.log(sum_exp / n);
        return { mu, sigma };
    }

    // --- Inverse Normal CDF ---
    function normPPF(p) {
        if (p <= 0) return -Infinity;
        if (p >= 1) return Infinity;
        const a1 = -39.6968302866538, a2 = 220.946098424521, a3 = -275.928510446969;
        const a4 = 138.357751867269, a5 = -30.6647980661472, a6 = 2.50662827745924;
        const b1 = -54.4760987982241, b2 = 161.585836858041, b3 = -155.698979859887;
        const b4 = 66.8013118877197, b5 = -13.2806815528857;
        let x = p;
        if (x > 0.5) x = 1 - x;
        let y = Math.sqrt(-2 * Math.log(x));
        let z = y - (a1 + a2*y + a3*y*y + a4*y*y*y + a5*y*y*y*y + a6*y*y*y*y*y) / 
                  (1 + b1*y + b2*y*y + b3*y*y*y + b4*y*y*y*y + b5*y*y*y*y*y);
        return p > 0.5 ? -z : z;
    }

    // --- The Real Engine ---
    function runRealCalculation() {
        const city = document.getElementById('citySelect').value;
        const year = parseInt(document.getElementById('yearInput').value);
        const resultsDiv = document.getElementById('results');
        const warningMsg = document.getElementById('warningMsg');
        
        resultsDiv.style.display = 'none';
        warningMsg.style.display = 'none';

        if (!city || isNaN(year)) {
            alert("Please select a valid city and a year.");
            return;
        }

        let data = [];
        let baselineV50 = 0;
        let valueKey = '';
        if (city === 'miami') { data = miamiData; baselineV50 = 49.2; valueKey = 'Max_Wind_mps'; }
        else if (city === 'chicago') { data = chicagoData; baselineV50 = 52.1; valueKey = 'Max_Wind_mps'; }
        else if (city === 'la') { data = laData; baselineV50 = 0.62; valueKey = 'Max_PGA_g'; }

        // CRITICAL FIX: Sort data by date before filtering
        data.sort((a,b) => new Date(a.Date) - new Date(b.Date));

        // Filter 30-year window
        const endYear = year;
        const startYear = endYear - 30;
        const windowData = data.filter(row => {
            const d = new Date(row.Date);
            return d.getFullYear() >= startYear && d.getFullYear() <= endYear;
        });

        if (windowData.length < 30) {
            warningMsg.innerText = `⚠️ Insufficient data for ${year}. Try a year after ${startYear + 15}.`;
            warningMsg.style.display = 'block';
            return;
        }

        // Extract values
        const values = windowData.map(row => parseFloat(row[valueKey])).filter(v => !isNaN(v) && v > 0);

        if (values.length < 30) {
            warningMsg.innerText = `⚠️ Insufficient valid storm events for ${year}.`;
            warningMsg.style.display = 'block';
            return;
        }

        // MLE Gumbel Fit
        const { mu, sigma } = gumbelMLE(values);

        // Calculate V50
        const V50 = mu - sigma * Math.log(-Math.log(0.98));

        // Calculate EWMA Volatility
        const total = windowData.length;
        const recent = windowData.slice(-Math.floor(total * 0.25));
        const older = windowData.slice(0, total - recent.length);
        
        const recentVals = recent.map(r => parseFloat(r[valueKey])).filter(v => !isNaN(v) && v > 0);
        const olderVals = older.map(r => parseFloat(r[valueKey])).filter(v => !isNaN(v) && v > 0);
        
        if (recentVals.length < 5 || olderVals.length < 5) {
            warningMsg.innerText = `⚠️ Insufficient data for volatility calculation.`;
            warningMsg.style.display = 'block';
            return;
        }

        const recentMean = recentVals.reduce((a,b) => a + b, 0) / recentVals.length;
        const recentStd = Math.sqrt(recentVals.reduce((a,b) => a + (b - recentMean)**2, 0) / recentVals.length);
        const olderMean = olderVals.reduce((a,b) => a + b, 0) / olderVals.length;
        const olderStd = Math.sqrt(olderVals.reduce((a,b) => a + (b - olderMean)**2, 0) / olderVals.length);
        
        const weightedStd = 0.7 * recentStd + 0.3 * olderStd;
        const weightedMean = 0.7 * recentMean + 0.3 * olderMean;
        const CV20 = weightedStd / weightedMean;

        // Crisis Trigger
        const last3Years = windowData.slice(-Math.floor(total * 0.15));
        const last3Vals = last3Years.map(r => parseFloat(r[valueKey])).filter(v => !isNaN(v) && v > 0);
        const mean3 = last3Vals.reduce((a,b) => a + b, 0) / last3Vals.length;
        const mean20 = windowData.map(r => parseFloat(r[valueKey])).filter(v => !isNaN(v) && v > 0).reduce((a,b) => a + b, 0) / windowData.length;
        const psi = (mean3 / mean20 > 1.25) ? 1.12 : 1.0;

        // Calculate Omega
        const beta0 = 3.5;
        const delta = 0.22;
        const floor = 1.08;
        const ratio = V50 / baselineV50;
        let omega = Math.pow(ratio, beta0) * (1 + delta * CV20) * psi;
        omega = Math.max(omega, floor);

        // Calculate Design Load
        const designLoad = omega * V50;

        // Monte Carlo for Beta
        const mcIterations = 5000;
        let failures = 0;
        for (let i = 0; i < mcIterations; i++) {
            const randomLoad = mu - sigma * Math.log(-Math.log(Math.random()));
            const factoredLoad = randomLoad * omega;
            if (factoredLoad > baselineV50) failures++;
        }
        const Pf = failures / mcIterations;
        let beta = 4.5;
        if (Pf > 0 && Pf < 1) beta = -normPPF(Pf);

        // Display Results
        document.getElementById('outputOmega').innerText = omega.toFixed(3);
        document.getElementById('outputSavings').innerText = ((1 - 1/omega) * 100).toFixed(2) + '%';
        document.getElementById('outputV50').innerText = V50.toFixed(2) + ' m/s';
        document.getElementById('outputDesignLoad').innerText = designLoad.toFixed(2) + ' m/s';
        document.getElementById('outputBeta').innerText = beta.toFixed(2);
        resultsDiv.style.display = 'block';
    }
</script>
</body>
</html>
